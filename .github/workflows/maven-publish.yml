# Builds the Maven services and publishes them to GitHub Packages when a release is created.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish • ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ spring-cloud-eureka-feign-client, spring-cloud-eureka-feign-client-integration-test ]
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
          server-id: github # matches the id used in altDeploymentRepository below
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Build with Maven
        run: ./mvnw -B -ntp package

      - name: Publish to GitHub Packages Apache Maven
        run: >
          ./mvnw -B -ntp deploy -DskipTests
          -s "$GITHUB_WORKSPACE/settings.xml"
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
